$kind: http-request
description: |-
  ### 📜 Get User Orders
  Fetches all orders belonging to `userId`.
url: "{{baseUrl}}/api/order/user/:userId"
method: GET
pathVariables:
  userId: "{{userId}}"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('User orders is an array', function () {
          var res = pm.response.json();
          pm.expect(res).to.be.an('array');
      });
    language: text/javascript
order: 3000
