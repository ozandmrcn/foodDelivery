$kind: http-request
name: Update Order Status (Admin / Restaurant Owner)
description: |-
  ### ⚡ Update Order Status
  Changes order status to `preparing`.
url: "{{baseUrl}}/api/order/:orderId/status"
method: PUT
headers:
  Content-Type: application/json
pathVariables:
  orderId: "{{orderId}}"
body:
  type: json
  content: |-
    {
        "status": "preparing",
        "reason": "Order is currently being prepared"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Order status updated successfully', function () {
          var res = pm.response.json();
          pm.expect(res.order.status).to.eql('preparing');
      });
    language: text/javascript
order: 4000
