$kind: http-request
description: |-
  ### 🔍 Get Order Details
  Fetches order details by `orderId`.
url: "{{baseUrl}}/api/order/:orderId"
method: GET
pathVariables:
  orderId: "{{orderId}}"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Order details returned', function () {
          var res = pm.response.json();
          pm.expect(res.items).to.be.an('array');
      });
    language: text/javascript
order: 2000
