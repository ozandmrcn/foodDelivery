$kind: http-request
description: |-
  ### 🔑 User Login
  Logs in with credentials and saves `token` and `userId`.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{userEmail}}",
        "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      if (pm.response.code === 200) {
          var res = pm.response.json();
          if (res.result && res.result.data) {
              if (res.result.data.accessToken) pm.collectionVariables.set('token', res.result.data.accessToken);
              if (res.result.data.refreshToken) pm.collectionVariables.set('refreshToken', res.result.data.refreshToken);
              if (res.result.data.user && res.result.data.user.id) pm.collectionVariables.set('userId', res.result.data.user.id);
              console.log('🔑 User Logged in successfully');
          }
      }
    language: text/javascript
order: 2000
