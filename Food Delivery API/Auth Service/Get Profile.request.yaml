$kind: http-request
description: |-
  ### 👤 Get Profile
  Fetches authenticated user profile.
url: "{{baseUrl}}/api/auth/profile"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Profile returns user object', function () {
          var res = pm.response.json();
          pm.expect(res.user).to.be.an('object');
      });
    language: text/javascript
order: 3000
