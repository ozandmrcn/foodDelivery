$kind: http-request
name: Create Restaurant (Admin / Restaurant Owner)
description: |-
  ### 🏪 Create Restaurant
  Creates a restaurant and saves `restaurantId`.
url: "{{baseUrl}}/api/restaurants"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "name": "Burger King",
        "description": "Delicious flame-grilled burgers, crispy fries and fresh drinks.",
        "address": "456 Broadway Ave, New York, NY",
        "phone": "+12125551234",
        "email": "burgerking@delivery.com",
        "categories": [
            "Burger",
            "Fast Food",
            "American"
        ],
        "deliveryTime": 30,
        "minOrder": 15,
        "deliveryFee": 3,
        "rating": 4.8,
        "isActive": true,
        "isOpen": true,
        "openingHours": {
            "monday": "09:00 - 23:00",
            "tuesday": "09:00 - 23:00",
            "wednesday": "09:00 - 23:00",
            "thursday": "09:00 - 23:00",
            "friday": "09:00 - 00:00",
            "saturday": "09:00 - 00:00",
            "sunday": "09:00 - 23:00"
        }
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 or 201', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      if (pm.response.code === 200 || pm.response.code === 201) {
          var res = pm.response.json();
          var restId = res.id || res._id;
          if (restId) {
              pm.collectionVariables.set('restaurantId', restId);
              console.log('🏪 Restaurant ID saved:', restId);
          }
      }
    language: text/javascript
order: 1000
