$kind: http-request
description: |-
  ### 🍕 Get Restaurant Menu
  Lists all food items offered by the restaurant.
url: "{{baseUrl}}/api/restaurants/:id/menu"
method: GET
pathVariables:
  id: "{{restaurantId}}"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response is an array of menu items', function () {
          var res = pm.response.json();
          pm.expect(res).to.be.an('array');
      });
    language: text/javascript
order: 5000
