$kind: http-request
description: |-
  ### 🚴 Courier Registration
  Registers a new courier with vehicle details and sets `courierToken` and `courierId`.
url: "{{baseUrl}}/api/delivery/couriers/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{courierEmail}}",
        "password": "password123",
        "firstName": "John",
        "lastName": "Courier",
        "phone": "+12125559876",
        "vehicleType": "motorcycle",
        "vehiclePlate": "34XYZ789",
        "isAvailable": true
    }
scripts:
  - type: beforeRequest
    code: |-
      // Always generate fresh email for Courier Register to avoid duplicate key errors
      pm.collectionVariables.set('courierEmail', 'courier_' + Date.now() + '@delivery.com');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 201 Created', function () {
          pm.response.to.have.status(201);
      });

      if (pm.response.code === 201) {
          var res = pm.response.json();
          if (res.data) {
              if (res.data.token) pm.collectionVariables.set('courierToken', res.data.token);
              if (res.data.courier && (res.data.courier._id || res.data.courier.id)) {
                  pm.collectionVariables.set('courierId', res.data.courier._id || res.data.courier.id);
              }
              console.log('🚴 Courier Registered & Token Saved');
          }
      }
    language: text/javascript
order: 1000
