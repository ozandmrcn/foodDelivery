$kind: http-request
description: |-
  ### 📍 Live Order Tracking
  Fetches courier live location, arrival estimates and delivery status.
url: "{{baseUrl}}/api/delivery/orders/:orderId/tracking"
method: GET
pathVariables:
  orderId: "{{orderId}}"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 8000
