$kind: http-request
description: |-
  ### 🚴 Courier Login
  Logs in courier and saves `courierToken`.
url: "{{baseUrl}}/api/delivery/couriers/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{courierEmail}}",
        "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      if (pm.response.code === 200) {
          var res = pm.response.json();
          if (res.data && res.data.token) {
              pm.collectionVariables.set('courierToken', res.data.token);
              if (res.data.courier && (res.data.courier._id || res.data.courier.id)) {
                  pm.collectionVariables.set('courierId', res.data.courier._id || res.data.courier.id);
              }
              console.log('🚴 Courier Logged in successfully');
          }
      }
    language: text/javascript
order: 2000
