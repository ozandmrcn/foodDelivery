$kind: http-request
description: |-
  ### 📊 Get Courier Performance
  Admin endpoint to query performance stats of a courier.
url: "{{baseUrl}}/api/delivery/couriers/:courierId/performance?period=weekly"
method: GET
queryParams:
  period: weekly
pathVariables:
  courierId: "{{courierId}}"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
