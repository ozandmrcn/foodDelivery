$kind: http-request
description: |-
  ### 🚚 Update Delivery Status
  Updates delivery progress (`assigned`, `picked_up`, `in_transit`, `delivered`, `failed`).
url: "{{baseUrl}}/api/delivery/orders/:orderId/status"
method: PATCH
headers:
  Content-Type: application/json
pathVariables:
  orderId: "{{orderId}}"
body:
  type: json
  content: |-
    {
        "status": "in_transit",
        "location": {
            "latitude": 40.7128,
            "longtitude": -74.0060
        },
        "estimatedArrival": 15,
        "notes": "Courier on the way with order"
    }
auth:
  type: bearer
  credentials:
    token: "{{courierToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 7000
