$kind: http-request
description: |-
  ### 📍 Update Courier Status
  Updates courier availability status (`available`, `busy`, `offline`) and current GPS coordinates.
url: "{{baseUrl}}/api/delivery/couriers/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "status": "available",
        "location": {
            "latitude": 40.7128,
            "longtitude": -74.0060
        }
    }
auth:
  type: bearer
  credentials:
    token: "{{courierToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
